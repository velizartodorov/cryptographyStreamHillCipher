name: Security Scan

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Mondays at 2 AM

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v4.37.7
      with:
        languages: cpp
        queries: security-extended,security-and-quality

    - name: Build for CodeQL
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug
        cmake --build build --target TestProject --parallel

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4.37.7

    - name: Check for security anti-patterns
      run: |
        echo "Checking for security anti-patterns..."

        echo "Checking for unsafe string functions:"
        grep -rEi "strcpy|strcat|sprintf|gets|scanf" --include="*.cpp" --include="*.h" . || echo "No unsafe string functions found"

        echo "Checking for buffer overflow risks:"
        grep -rE "char.*\[.*\]" --include="*.cpp" --include="*.h" . || echo "No fixed-size buffers found"

        echo "Checking for memory management issues:"
        grep -rEi "malloc|free|new|delete" --include="*.cpp" --include="*.h" . || echo "No manual memory management found"

        echo "Checking for potential integer overflow:"
        grep -rE "int.*\*.*int|int.*\+.*int" --include="*.cpp" --include="*.h" . || echo "No potential integer overflow found"

        echo "Security scan completed"
      continue-on-error: true

    - name: Check for hardcoded secrets
      run: |
        echo "Checking for potential hardcoded secrets..."
        grep -rEi "password|secret|key.*=.*[a-zA-Z0-9]{8,}|token.*=.*[a-zA-Z0-9]{8,}" --include="*.cpp" --include="*.h" . || echo "No potential secrets found"
      continue-on-error: true
