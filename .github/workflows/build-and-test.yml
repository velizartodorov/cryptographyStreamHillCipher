name: Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Allow manual triggering

jobs:
  build-and-test:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Display build information
      run: |
        echo "Building configuration: ${{ matrix.configuration }}"
        cmake --version
        g++ --version

    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

    - name: Build
      run: cmake --build build --parallel

    - name: Verify Test Executable
      run: |
        if [ -x "build/TestProject" ]; then
          echo "Test executable found successfully"
          ls -l build/TestProject
        else
          echo "Test executable not found!"
          echo "Contents of build directory:"
          ls -lR build
          exit 1
        fi

    - name: Run Test Suite
      run: |
        echo "Starting test execution..."
        ./build/TestProject

    - name: Archive build artifacts
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build-artifacts-${{ matrix.configuration }}
        path: |
          build/StreamHillCipherEncoding
          build/TestProject
          *.log
        retention-days: 7
