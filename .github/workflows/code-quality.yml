name: Code Quality

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Build with warnings as errors
      run: |
        cmake -B build-strict -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror"
        cmake --build build-strict --target TestProject --parallel
      continue-on-error: true

    - name: Check for common C++ issues
      run: |
        echo "Checking for common C++ code issues..."

        echo "Checking for TODO comments:"
        grep -rEi "todo|fixme|hack" --include="*.cpp" --include="*.h" . || echo "No TODO comments found"

        echo "Checking for debug code:"
        grep -rEi "printf|cout.*debug|cerr.*debug" --include="*.cpp" --include="*.h" . || echo "No debug output found"

        echo "Checking for hardcoded paths:"
        grep -rEi "[a-z]:\\\\" --include="*.cpp" --include="*.h" . || echo "No hardcoded paths found"

        echo "Code quality check completed"
      continue-on-error: true

    - name: Validate project structure
      run: |
        echo "Validating project structure..."

        if [ ! -f "CMakeLists.txt" ]; then
          echo "ERROR: CMakeLists.txt not found"
          exit 1
        fi

        if [ ! -f "tests/TestFramework.h" ]; then
          echo "ERROR: tests/TestFramework.h not found"
          exit 1
        fi

        echo "Project structure validation passed"

    - name: Check file encoding
      run: |
        echo "Checking file encodings..."
        find . -name "*.cpp" -o -name "*.h" | while read -r f; do
          echo "Checking $f"
          file "$f"
        done
      continue-on-error: true
