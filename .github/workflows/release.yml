name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Release
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel

    - name: Run Release Tests
      run: |
        echo "Running tests on release build..."
        ./build/TestProject

    - name: Create release package
      run: |
        mkdir release-package
        cp build/StreamHillCipherEncoding release-package/
        cp build/TestProject release-package/
        cp README_TESTS.md release-package/
        cp StreamHillCipherEncoding.cpp release-package/
        cp -r HillCipher release-package/HillCipher
        cp -r Matrix release-package/Matrix
        cp -r StreamCipher release-package/StreamCipher
        cp -r Utils release-package/Utils
        cp -r tests release-package/tests

        echo "Release package contents:"
        find release-package -type f

    - name: Create tarball
      run: |
        tar -czf "StreamHillCipherEncoding-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C release-package .
        echo "Release archive created:"
        ls -l *.tar.gz

    - name: Upload release artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ steps.version.outputs.version }}
        path: |
          StreamHillCipherEncoding-${{ steps.version.outputs.version }}-linux-x64.tar.gz
          build/StreamHillCipherEncoding
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      with:
        files: StreamHillCipherEncoding-${{ steps.version.outputs.version }}-linux-x64.tar.gz
        name: Release ${{ steps.version.outputs.version }}
        body: |
          ## StreamHillCipherEncoding ${{ steps.version.outputs.version }}

          ### Changes
          - Automated release build
          - Full test suite validation
          - Linux x64 binary (see the Docker image for a portable, dependency-free way to run it on any platform)

          ### Files
          - `StreamHillCipherEncoding` - Main application
          - `TestProject` - Test suite
          - Source code and headers

          ### Testing
          All tests passed successfully in the release build.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
